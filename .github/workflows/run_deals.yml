name: Run deals

on:
  schedule:
    - cron: "0 7 * * 1,4"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: scraper/requirements.txt

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r scraper/requirements.txt

      - name: Install Playwright Chromium
        run: python -m playwright install --with-deps chromium

      - name: Read latest finds from claude/finds
        run: |
          # The finder job pushes state/finds.json to claude/finds. A missing branch or
          # file is normal until the finder has run; the scraper then re-checks old finds only.
          if git fetch --depth=1 origin +claude/finds:refs/remotes/origin/claude/finds \
             && git show origin/claude/finds:state/finds.json > "$RUNNER_TEMP/finds.json"; then
            echo "Read finds from claude/finds."
          else
            rm -f "$RUNNER_TEMP/finds.json"
            echo "No finds to read yet."
          fi

      - name: Run deal scraper
        env:
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          TO_EMAIL: ${{ secrets.TO_EMAIL }}
          FINDS_INCOMING: ${{ runner.temp }}/finds.json
        run: python scraper/main.py

      - name: Commit updated deals page, inventory, and review log
        run: |
          git config user.name  "giftful-deals-bot"
          git config user.email "giftful-deals-bot@users.noreply.github.com"
          changed=""
          if [ -n "$(git status --porcelain docs/index.html)" ]; then
            git add docs/index.html
            changed="docs/index.html"
          fi
          if [ -n "$(git status --porcelain state/inventory.json)" ]; then
            git add state/inventory.json
            changed="${changed} state/inventory.json"
          fi
          if [ -n "$(git status --porcelain state/review_log.json)" ]; then
            git add state/review_log.json
            changed="${changed} state/review_log.json"
          fi
          if [ -n "$(git status --porcelain state/taste.json)" ]; then
            git add state/taste.json
            changed="${changed} state/taste.json"
          fi
          if [ -n "$(git status --porcelain state/tracked_finds.json)" ]; then
            git add state/tracked_finds.json
            changed="${changed} state/tracked_finds.json"
          fi
          if [ -n "$changed" ]; then
            git commit -m "chore: update deals page, inventory, review log"
            git pull --rebase origin main
            git push
          else
            echo "No tracked output changes."
          fi

      - name: Upload errors.log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: errors-log
          path: errors.log
          if-no-files-found: ignore
